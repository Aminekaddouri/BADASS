frr version 8.4.1_git
frr defaults traditional
hostname RR
no ipv6 forwarding

# OSPF - underlay routing so routers find each other's loopback IPs
router ospf
 network 1.1.1.1/32 area 0
 network 10.1.1.0/30 area 0
 network 10.1.1.4/30 area 0
 network 10.1.1.8/30 area 0
exit

# BGP - Route Reflector configuration
# ibgp peer-group accepts all leaf routers in range 1.1.1.0/29
# route-reflector-client reflects routes between all leaves
router bgp 1
 neighbor ibgp peer-group
 neighbor ibgp remote-as 1
 neighbor ibgp update-source lo
 bgp listen range 1.1.1.0/29 peer-group ibgp
 address-family l2vpn evpn
  neighbor ibgp activate
  neighbor ibgp route-reflector-client
 exit-address-family
exit
